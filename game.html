<!DOCTYPE html>
<html>
<head>
  <title>Reveal Words</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="game-background">
  <h1>Reveal Your Word</h1>
  <div id="wordScreen">
    <h2 id="currentPlayer"></h2>
    <button onclick="toggleWord()">Reveal / Hide Word</button>
    <p id="word" class="hidden"></p>
    <div id="cardImageContainer" class="hidden"></div>
    <button onclick="nextPlayer()">Continue</button>
  </div>

  <script>
    let cards = [];
    let players = JSON.parse(localStorage.getItem("players") || "[]");
    let assignments = [];
    let currentPlayerIndex = 0;

    async function loadCards() {
      const response = await fetch("cards.json");
      cards = await response.json();
      startRound();
    }

    function startRound() {
      const sharedCard = cards[Math.floor(Math.random() * cards.length)];
      const sharedWord = sharedCard.name;
      const sharedKey = sharedCard.key;

      const imposterCount = parseInt(localStorage.getItem("imposterCount") || "1");
      const imposterIndexes = [];

      while (imposterIndexes.length < imposterCount) {
        const index = Math.floor(Math.random() * players.length);
        if (!imposterIndexes.includes(index)) {
          imposterIndexes.push(index);
        }
      }

      assignments = players.map((_, i) => {
        if (imposterIndexes.includes(i)) {
          return { word: "You are the imposter!", key: "imposter" };
        } else {
          return { word: sharedWord, key: sharedKey };
        }
      });

      localStorage.setItem("assignments", JSON.stringify(assignments));
      localStorage.setItem("imposterIndexes", JSON.stringify(imposterIndexes));
      showPlayer();
    }

    function showPlayer() {
      const name = players[currentPlayerIndex];
      const { word } = assignments[currentPlayerIndex];

      document.getElementById("currentPlayer").innerText = `${name}'s turn`;
      document.getElementById("word").innerText = word;
      document.getElementById("word").classList.add("hidden");

      const container = document.getElementById("cardImageContainer");
      container.innerHTML = "";
      container.classList.add("hidden");
    }

    function toggleWord() {
      const { key } = assignments[currentPlayerIndex];
      const container = document.getElementById("cardImageContainer");

      document.getElementById("word").classList.toggle("hidden");
      container.classList.toggle("hidden");

      const img = document.createElement("img");
      img.alt = "Card image";
      img.classList.add("card-reveal");

      if (key === "imposter") {
        img.classList.add("card-imposter");
      } else {
        img.classList.add("card-normal");
      }

      const fileName = key === "imposter"
        ? "imposter.png"
        : key.toLowerCase().replace(/[\s\.\-]/g, "-") + ".png";

      img.src = "cards-150/" + fileName;
      container.innerHTML = "";
      container.appendChild(img);
    }

    function nextPlayer() {
      currentPlayerIndex++;
      if (currentPlayerIndex < players.length) {
        showPlayer();
      } else {
        window.location.href = "reveal.html";
      }
    }

    loadCards();
  </script>
</body>
</html>
